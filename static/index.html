<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deep · AI assistant</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#151B32">
<style>
  :root { --bg:#EEF0F8; --muted:#68718A }
  * { box-sizing:border-box }
  html, body { height:100% }
  body { margin:0; background:radial-gradient(1200px 600px at 50% -10%, #E4E1FF 0%, var(--bg) 60%); color:#151B32; font:14px/1.5 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100dvh; padding:24px 16px; gap:14px }
  deep-assistant { width:400px; height:700px; max-height:calc(100dvh - 72px); display:block; border-radius:20px; box-shadow:0 28px 64px -16px rgba(21,27,50,.34), 0 0 0 1px rgba(21,27,50,.06) }
  .links { font-size:12.5px; color:var(--muted); text-align:center } .links a { color:var(--muted) }
  @media (max-width:480px) { body { padding:0; gap:0 } deep-assistant { width:100vw; height:100dvh; max-height:none; border-radius:0; box-shadow:none } .links { display:none } }
</style>
</head>
<body>
<deep-assistant id="assistant" api="" mode="panel" theme="light"></deep-assistant>
<div class="links">See it as the site embeds it (launcher, greeting card, quick replies): <a href="/site">/site</a> · console: <a href="/admin">/admin</a> · <span id="ver"></span></div>
<script type="module">
  const api = location.origin;
  // version query keeps browsers from reusing an older build of the component
  const v = (await (await fetch(api + '/healthz', { cache: 'no-store' })).json()).version;
  await import(`${api}/static/deep-assistant.js?v=${encodeURIComponent(v)}`);
  document.getElementById('assistant').setAttribute('api', api);
  document.getElementById('ver').textContent = 'assistant v' + v;
</script>
</body>
</html>
