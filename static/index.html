<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deep · AI assistant</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#151B32">
<style>
  :root { --bg:#EEF0F8; --muted:#68718A }
  * { box-sizing:border-box }
  html, body { height:100% }
  body { margin:0; background:var(--bg); color:#151B32; font:14px/1.5 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100dvh; padding:24px 16px; gap:12px }
  deep-assistant { width:392px; height:680px; max-height:calc(100dvh - 64px); display:block; border-radius:16px; box-shadow:0 20px 48px -16px rgba(21,27,50,.28), 0 0 0 1px rgba(21,27,50,.06) }
  .links { font-size:11.5px; color:var(--muted); text-align:center; opacity:.8 } .links a { color:var(--muted) }
  @media (max-width:480px) { body { padding:0; gap:0 } deep-assistant { width:100vw; height:100dvh; max-height:none; border-radius:0; box-shadow:none } .links { display:none } }
</style>
</head>
<body>
<deep-assistant id="assistant" api="" mode="panel" theme="light"></deep-assistant>
<div class="links"><a href="/site">Site embed</a> · <a href="/admin">Console</a> · <span id="ver"></span></div>
<script type="module">
  // Ask Deep from a booking email (/ask#t=<token>&q=<key>): read the fragment and take it out of the address bar before
  // anything records the page; the component exchanges the token once it is ready (POST /ask/claim)
  const m = /^#(?:t=([A-Za-z0-9_.-]{10,160}))?(?:&?q=([a-z_]{1,24}))?$/.exec(location.hash || '');
  const ask = location.pathname === '/ask' && m && (m[1] || m[2]) ? { t: m[1] || null, q: m[2] || null } : null;
  if (location.pathname === '/ask' && location.hash) history.replaceState(null, '', location.pathname + location.search);
  const api = location.origin;
  // version query keeps browsers from reusing an older build of the component
  const v = (await (await fetch(api + '/healthz', { cache: 'no-store' })).json()).version;
  // set api before the element upgrades, so its first render keys the session under it and sends /track and /me
  document.getElementById('assistant').setAttribute('api', api);
  await import(`${api}/static/deep-assistant.js?v=${encodeURIComponent(v)}`);
  document.getElementById('ver').textContent = 'assistant v' + v;
  if (ask) { const el = document.getElementById('assistant'); await customElements.whenDefined('deep-assistant'); el.claimEmailLink(ask.t, ask.q); }
</script>
</body>
</html>
