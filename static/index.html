<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask deep &gt;_</title>
<meta name="color-scheme" content="dark light">
<style>
  :root { --bg:#000000; --fg:#E9EAEC; --muted:#8A8D93 }
  * { box-sizing:border-box }
  html, body { height:100% }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100dvh; padding:24px 16px; gap:14px }
  deep-assistant { width:400px; height:700px; max-height:calc(100dvh - 40px); display:block; border-radius:16px; box-shadow:0 0 0 1px #1F1F22, 0 18px 50px rgba(0,0,0,.6) }
  .links { font-size:12.5px; color:var(--muted); text-align:center } .links a { color:var(--muted) }
  @media (max-width:480px) { body { padding:0; gap:0 } deep-assistant { width:100vw; height:100dvh; max-height:none; border-radius:0 } .links { display:none } }
</style>
</head>
<body>
<deep-assistant id="assistant" api="" mode="panel" theme="dark"></deep-assistant>
<div class="links">See it as the site embeds it (launcher, greeting card, quick replies): <a href="/site">/site</a> · console: <a href="/admin">/admin</a> · <span id="ver"></span></div>
<script type="module">
  const api = location.origin;
  // version query keeps browsers from reusing an older build of the component
  const v = (await (await fetch(api + '/healthz', { cache: 'no-store' })).json()).version;
  await import(`${api}/static/deep-assistant.js?v=${encodeURIComponent(v)}`);
  document.getElementById('assistant').setAttribute('api', api);
  document.getElementById('ver').textContent = 'assistant v' + v;
</script>
</body>
</html>
