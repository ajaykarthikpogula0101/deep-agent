<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask deep &gt;_</title>
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ---- Electron scan: a precision instrument. Graphite tinted green, scan-green reticles, orange beam for the one primary action. ---- */
  :root {
    --bg: #0e1311; --panel: #141b18; --panel-2: #1b2420; --line: #27332d; --line-strong: #3a4a41;
    --text: #e6ece8; --muted: #9aa8a0; --scan: #8fd3a3; --scan-dim: #3f6b52; --scan-ink: #0e1311;
    --beam: #f28c28; --beam-text: #f6a94f; --on-beam: #1a1208; --danger: #e8907f;
    --scanline: rgba(0, 0, 0, .10); --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }
  :root[data-theme="light"] {
    --bg: #f2f5f1; --panel: #fbfcfa; --panel-2: #e9eeea; --line: #d3dcd5; --line-strong: #aebbb2;
    --text: #182019; --muted: #5c6b62; --scan: #257a4d; --scan-dim: #9ec5ad; --scan-ink: #fbfcfa;
    --beam: #f28c28; --beam-text: #a94c12; --on-beam: #1a1208; --danger: #b4452f;
    --scanline: rgba(0, 0, 0, .025); --shadow: 0 8px 24px rgba(20, 40, 30, .12);
  }
  /* Dark is the instrument's default; light is an explicit choice via the toggle (persisted). */

  * { box-sizing: border-box }
  html, body { height: 100% }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.55 "IBM Plex Sans", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100dvh; -webkit-font-smoothing: antialiased }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(to bottom, transparent 0 2px, var(--scanline) 2px 3px) }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: .06em; text-transform: uppercase }
  a { color: var(--beam-text) }
  button { font: inherit; color: inherit }
  :focus-visible { outline: 2px solid var(--scan); outline-offset: 2px }

  /* ---- header: brand, actions, readouts ---- */
  header { flex: none; background: var(--panel); border-bottom: 1px solid var(--line) }
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px 8px }
  .mark { width: 22px; height: 22px; flex: none; color: var(--scan) }
  .brand { min-width: 0 }
  .brand h1 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.2; white-space: nowrap }
  .brand h1 span { color: var(--scan); font-family: "IBM Plex Mono", monospace; font-weight: 500 }
  .brand p { margin: 1px 0 0; font-size: 13px; line-height: 1.35; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
  @media (min-width: 640px) { .brand p { display: block; white-space: nowrap; text-overflow: ellipsis } }
  .esc { display: none } @media (min-width: 640px) { .esc { display: inline } }
  .actions { margin-left: auto; display: flex; gap: 4px }
  .icon { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid transparent; background: transparent; border-radius: 4px; cursor: pointer; color: var(--muted) }
  .icon:hover { color: var(--text); border-color: var(--line); background: var(--panel-2) }
  .icon svg { width: 18px; height: 18px }
  .readouts { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 0 16px 10px; color: var(--muted) }
  .readouts span b { color: var(--text); font-weight: 500; text-transform: none; letter-spacing: 0 }
  .readouts .live b { color: var(--scan) }
  .readouts .live.off b { color: var(--danger) }
  .readouts .live.busy b { color: var(--beam-text) }
  .scanbar { height: 2px; background: var(--line); position: relative; overflow: hidden }
  .scanbar i { position: absolute; top: 0; left: 0; width: 28%; height: 100%; background: var(--scan); transform: translateX(-100%); visibility: hidden }
  body.busy .scanbar i { visibility: visible; animation: sweep 1.4s linear infinite }
  @keyframes sweep { to { transform: translateX(360%) } }

  /* ---- conversation ---- */
  .logwrap { flex: 1; min-height: 0; position: relative }
  #log { height: 100%; overflow-y: auto; overflow-x: hidden; padding: 20px 16px 12px; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth }
  .row { display: flex; flex-direction: column; max-width: 88%; animation: rise .25s cubic-bezier(.16, 1, .3, 1) both }
  .row.bot { align-self: flex-start } .row.user { align-self: flex-end; align-items: flex-end }
  .meta { display: flex; align-items: baseline; gap: 10px; margin: 0 6px 6px; color: var(--muted) }
  .meta .who { color: var(--scan) } .user .meta .who { color: var(--muted) }
  .msg { position: relative; padding: 12px 16px; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; max-width: 100%; border: 1px solid var(--line);
    background-color: var(--panel);
    /* reticle brackets: one 10×1 and one 1×10 line in each corner */
    background-image: linear-gradient(var(--scan), var(--scan)), linear-gradient(var(--scan), var(--scan)), linear-gradient(var(--scan), var(--scan)), linear-gradient(var(--scan), var(--scan)),
                      linear-gradient(var(--scan), var(--scan)), linear-gradient(var(--scan), var(--scan)), linear-gradient(var(--scan), var(--scan)), linear-gradient(var(--scan), var(--scan));
    background-repeat: no-repeat;
    background-size: 10px 1px, 1px 10px, 10px 1px, 1px 10px, 10px 1px, 1px 10px, 10px 1px, 1px 10px;
    background-position: left top, left top, right top, right top, left bottom, left bottom, right bottom, right bottom }
  .user .msg { background-color: var(--panel-2); border-color: var(--line-strong); background-image: none }
  .msg a:not(.btn) { text-decoration: underline; text-underline-offset: 3px }
  .li { display: block; padding-left: 16px; position: relative }
  .li::before { content: ""; position: absolute; left: 2px; top: .7em; width: 6px; height: 1px; background: var(--scan) }
  .msg.thinking { min-height: 44px; overflow: hidden }
  .msg.thinking::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: 14px; height: 1px; background: var(--line-strong) }
  .msg.thinking i { position: absolute; left: 16px; bottom: 14px; width: 36%; height: 1px; background: var(--scan); animation: sweep-in 1.1s linear infinite }
  @keyframes sweep-in { from { transform: translateX(-100%) } to { transform: translateX(280%) } }
  @keyframes rise { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }
  @media (prefers-reduced-motion: reduce) { .row { animation: none } .msg.thinking i, body.busy .scanbar i { animation: none; visibility: hidden } #log { scroll-behavior: auto } }

  .tools { display: flex; gap: 4px; margin: 6px 2px 0; opacity: .75 }
  .row:hover .tools, .row:focus-within .tools { opacity: 1 }
  .tool { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 10px; border: 1px solid transparent; background: transparent; border-radius: 4px; color: var(--muted); cursor: pointer }
  .tool:hover { color: var(--text); border-color: var(--line); background: var(--panel-2) }
  .tool svg { width: 14px; height: 14px }
  .tool.on { color: var(--scan); border-color: var(--scan) }
  .fbnote { display: flex; gap: 8px; margin: 6px 2px 0; align-items: center }
  .fbnote input { flex: 1; min-width: 0; min-height: 36px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--bg); color: var(--text); font: inherit; font-size: 14px }
  .fbnote .btn { min-height: 36px; padding: 6px 12px }
  /* hand-over form */
  .hform { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 2px; max-width: 420px }
  .hform .lbl { color: var(--muted) }
  .hform input, .hform textarea { min-height: 40px; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--bg); color: var(--text); font: inherit; resize: vertical }
  .hform .hrow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap }
  .note.ok { color: var(--scan) }

  /* citations: [n] in the prose becomes a small numbered link; the list sits under the bubble, outside the answer */
  .cite { display: inline-block; vertical-align: super; font: 500 10px/1 "IBM Plex Mono", monospace; color: var(--scan); text-decoration: none; margin-left: 2px; padding: 1px 4px; border: 1px solid var(--line-strong); border-radius: 3px; background: var(--bg) }
  a.cite:hover, a.cite:focus-visible { border-color: var(--scan); color: var(--text) }
  .sources { margin: 8px 2px 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-width: 100% }
  .sources .lbl { color: var(--muted); margin-right: 4px }
  .sources a { color: var(--text); text-decoration: none; border: 1px solid var(--line); background: var(--panel); padding: 5px 9px 5px 6px; border-radius: 3px; font-size: 13px; max-width: 300px; display: inline-flex; align-items: center; gap: 8px; min-width: 0 }
  .sources a b { font: 500 10px/1 "IBM Plex Mono", monospace; color: var(--scan); border: 1px solid var(--line-strong); border-radius: 3px; padding: 2px 5px; flex: none }
  .sources a .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
  .sources a .h { color: var(--muted); font-size: 12px; flex: none }
  .sources a:hover { border-color: var(--scan) }

  /* ---- buttons ---- */
  .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 9px 14px; border-radius: 4px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--text); cursor: pointer; text-decoration: none; text-align: left; line-height: 1.3; transition: border-color .15s, background .15s }
  .btn:hover { border-color: var(--scan) }
  .btn.primary { background: var(--beam); border-color: var(--beam); color: var(--on-beam); font-weight: 600 }
  .btn.primary:hover { filter: brightness(1.06) }
  .btn:disabled { opacity: .5; cursor: default }
  .btn small { display: block; font-size: 12px; color: var(--muted); font-weight: 400 }
  .btn.primary small { color: #4a3214 }
  .slots, .handoff { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 2px 2px; align-items: center }
  .note { font-size: 14px; color: var(--muted); margin: 8px 2px 0 }
  .note.warn { color: var(--danger) }

  /* ---- call-type picker ---- */
  .picker { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s cubic-bezier(.16, 1, .3, 1); margin: 0 2px; min-width: 0 }
  .picker.open { grid-template-rows: 1fr }
  .picker > div { min-height: 0; min-width: 0; overflow: hidden }
  .picker-in { display: flex; flex-direction: column; gap: 8px; padding: 12px 0 4px; min-width: 0 }
  .picker label { color: var(--muted) }
  .sel { position: relative; min-width: 0 }
  .sel select { width: 100%; max-width: 100%; min-height: 44px; padding: 10px 40px 10px 12px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--bg); color: var(--text); font: inherit; appearance: none; -webkit-appearance: none; cursor: pointer; text-overflow: ellipsis }
  .sel::after { content: ""; position: absolute; right: 14px; top: 50%; width: 8px; height: 8px; border-right: 1.5px solid var(--scan); border-bottom: 1.5px solid var(--scan); transform: translateY(-70%) rotate(45deg); pointer-events: none }
  .picker .btn { align-self: flex-start }
  .picker.done select, .picker.done .btn { opacity: .5; pointer-events: none }
  .picker .hint { font-size: 14px; color: var(--muted) }
  @media (prefers-reduced-motion: reduce) { .picker { transition: none } }

  /* ---- suggestions (empty state) ---- */
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 0 }
  .chip { min-height: 40px; padding: 8px 12px; border: 1px solid var(--line); background: transparent; border-radius: 999px; color: var(--text); cursor: pointer; font-size: 14px }
  .chip:hover { border-color: var(--scan); background: var(--panel) }

  /* ---- jump to latest ---- */
  .jump { position: absolute; right: 16px; bottom: 12px; display: none; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--text); cursor: pointer; box-shadow: var(--shadow); font-size: 13px }
  .jump.show { display: inline-flex }
  .jump svg { width: 14px; height: 14px }

  /* ---- composer ---- */
  form { flex: none; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)) }
  .composer { display: flex; gap: 8px; align-items: flex-end }
  label.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
  textarea { flex: 1; min-width: 0; resize: none; min-height: 44px; max-height: 160px; padding: 11px 12px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--bg); color: var(--text); font: inherit; line-height: 1.4 }
  textarea::placeholder { color: var(--muted) }
  .send { width: 44px; height: 44px; padding: 0; justify-content: center; flex: none }
  .send svg { width: 18px; height: 18px }
  .send.stop { background: var(--panel-2); border-color: var(--danger); color: var(--danger) }
  .hintline { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; color: var(--muted); font-size: 12px }
  .hintline .mono { text-transform: none; letter-spacing: 0; font-size: 12px }

  @media (min-width: 640px) { .bar { padding: 14px 22px 8px } .readouts { padding: 0 22px 12px } #log { padding: 24px 22px 12px } .row { max-width: 80% } form { padding-left: 22px; padding-right: 22px } .jump { right: 22px } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <svg class="mark" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <path d="M1 7V1h6M15 1h6v6M21 15v6h-6M7 21H1v-6"/><circle cx="11" cy="11" r="3"/><path d="M11 4v3M11 15v3M4 11h3M15 11h3"/>
    </svg>
    <div class="brand">
      <h1>ask <span>deep &gt;_</span></h1>
      <p>Answers from deependhq.com, with the page they came from. Books a call with Deep.</p>
    </div>
    <div class="actions">
      <button class="icon" id="theme" type="button" aria-label="Toggle light and dark theme" title="Theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon" id="download" type="button" aria-label="Download transcript" title="Download transcript">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
      </button>
      <button class="icon" id="reset" type="button" aria-label="New conversation" title="New conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12a8 8 0 1 1 2.3 5.7M4 20v-5h5"/></svg>
      </button>
    </div>
  </div>
  <div class="readouts mono">
    <span>src <b>deependhq.com</b></span>
    <span>tz <b id="tzv">—</b></span>
    <span>session <b id="sidv">—</b></span>
    <span class="live" id="live">status <b>checking</b></span>
  </div>
  <div class="scanbar" aria-hidden="true"><i></i></div>
</header>
<div class="logwrap">
  <div id="log" role="log" aria-live="polite" aria-label="Conversation"></div>
  <button class="jump" id="jump" type="button">latest <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
</div>
<form id="f" autocomplete="off">
  <div class="composer">
    <label for="q" class="vh">Your question</label>
    <textarea id="q" rows="1" placeholder="Ask about Deep, the companies, the log… or say “book a call”"></textarea>
    <button class="btn primary send" id="send" type="submit" aria-label="Send">
      <svg id="send-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <svg id="stop-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
    </button>
  </div>
  <div class="hintline"><span class="mono">Enter to send · Shift+Enter for a new line<span class="esc"> · Esc to stop</span></span><span class="mono" id="count"></span></div>
</form>
<script>
const API = (location.pathname.startsWith('/widget') || location.pathname === '/') ? '/chat' : (window.DH_ASSISTANT_API || '/chat');
const TRACK = API.replace(/\/chat$/, '/track'), HEALTH = API.replace(/\/chat$/, '/healthz');
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
const SESSION = (()=>{ try { return sessionStorage.getItem('dh_sid') || (sessionStorage.setItem('dh_sid', crypto.randomUUID()), sessionStorage.getItem('dh_sid')); } catch { return crypto.randomUUID(); } })();
// Origin tracker. When embedded, widget.js passes the host page, its referrer and the visitor id it keeps in the
// site's localStorage (?vid=&page=&ref=). Standalone, this page uses its own. Fires once per session.
const EMBED = new URLSearchParams(location.search);
const VISITOR = (()=>{ const v = EMBED.get('vid'); if (v) return v;
  try { return localStorage.getItem('dh_vid') || (localStorage.setItem('dh_vid', crypto.randomUUID()), localStorage.getItem('dh_vid')); } catch { return null; } })();
(function track() {
  try { if (sessionStorage.getItem('dh_tracked') === SESSION) return; } catch {}
  const body = { session_id: SESSION, visitor_id: VISITOR, page: EMBED.get('page') || location.href,
    referrer: EMBED.get('ref') || document.referrer || null, timezone: TZ, lang: navigator.language || null,
    screen: (screen && screen.width) ? `${screen.width}x${screen.height}` : null };
  fetch(TRACK, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body), keepalive:true })
    .then(() => { try { sessionStorage.setItem('dh_tracked', SESSION); } catch {} }).catch(() => {});
})();

const $ = id => document.getElementById(id);
const log = $('log'), f = $('f'), q = $('q'), sendBtn = $('send'), live = $('live'), jump = $('jump'), count = $('count');
const SUGGESTIONS = ['What does Lake B2B do?', 'What did Deep ship this week?', 'Which companies are in Champions Group?', 'Book a call with Deep'];
const STORE = 'dh_transcript';
let history = [], transcript = [], controller = null, busy = false;
$('tzv').textContent = TZ; $('sidv').textContent = SESSION.slice(0, 8);

// ---- theme
(function () { try { const t = localStorage.getItem('dh_theme'); if (t) document.documentElement.dataset.theme = t; } catch {} })();
$('theme').onclick = () => { const cur = document.documentElement.dataset.theme || 'dark';
  const next = cur === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = next; try { localStorage.setItem('dh_theme', next); } catch {} };

// ---- status
function setLive(state, label) { live.className = 'live ' + state; live.innerHTML = 'status <b>' + esc(label) + '</b>'; }
function setBusy(on) { busy = on; document.body.classList.toggle('busy', on); $('send-ico').style.display = on ? 'none' : ''; $('stop-ico').style.display = on ? '' : 'none';
  sendBtn.classList.toggle('stop', on); sendBtn.setAttribute('aria-label', on ? 'Stop' : 'Send'); setLive(on ? 'busy' : '', on ? 'scanning' : 'ready'); }
fetch(HEALTH, { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject()).then(() => setLive('', 'ready')).catch(() => setLive('off', 'offline'));

// ---- rendering
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Citations live outside the prose: any "Source:" line the model still writes is dropped, and [n] markers become
// small numbered links to the sources list under the answer (the server sends that list before the tokens).
function clean(text) { return text.replace(/【[^】]*】/g, '').replace(/^\s*\(?sources?\s*:.*$/gim, '').replace(/\n{3,}/g, '\n\n').trim(); }
function md(text, srcs) {   // minimal, safe markdown: escape first, then bold, links, bullets, citation markers
  let t = esc(clean(text));
  t = t.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  t = t.replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/^(?:[-*•]\s+)(.*)$/gm, '<span class="li">$1</span>');
  t = t.replace(/\s?\[(\d{1,2}(?:\s*,\s*\d{1,2})*)\]/g, (m, ids) => ids.split(',').map(x => {
    const n = parseInt(x, 10), s = (srcs || []).find(y => y.n === n);
    return s ? `<a class="cite" href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.title || s.url)}">${n}</a>` : `<sup class="cite">${n}</sup>`;
  }).join(''));
  return t;
}
function citedNumbers(text) { const out = new Set(); (text.match(/\[(\d{1,2}(?:\s*,\s*\d{1,2})*)\]/g) || []).forEach(m => m.slice(1, -1).split(',').forEach(x => out.add(parseInt(x, 10)))); return out; }
function stamp(ts) { return new Date(ts || Date.now()).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }); }
function add(role, text, ts) {
  const row = document.createElement('div'); row.className = 'row ' + role; row.dataset.role = role;
  const meta = document.createElement('div'); meta.className = 'meta mono';
  meta.innerHTML = `<span class="who">${role === 'bot' ? 'deep &gt;_' : 'you'}</span><span>${stamp(ts)}</span>`;
  const d = document.createElement('div'); d.className = 'msg'; d.textContent = text;
  row.append(meta, d); log.appendChild(row); scrollLatest(); return d;
}
function thinking(el) { el.classList.add('thinking'); el.innerHTML = '<i></i>'; }
function setText(el, text, srcs) { el.classList.remove('thinking'); const extras = Array.from(el.querySelectorAll(':scope > div, :scope > form')); el.innerHTML = md(text, srcs); extras.forEach(x => el.appendChild(x)); el.dataset.raw = clean(text); }
function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } }
// Sources list under the answer: the ones the answer cited, else the top three retrieved.
function usedSources(text, items) { const n = citedNumbers(text); const used = (items || []).filter(s => n.has(s.n)); return used.length ? used : (items || []).slice(0, 3); }
function addSources(el, items) {
  if (!items || !items.length) return;
  const s = document.createElement('div'); s.className = 'sources';
  s.innerHTML = '<span class="lbl mono">sources</span>' + items.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener" title="${esc(x.url)}"><b>${x.n}</b><span class="t">${esc(x.title || x.url)}</span><span class="h">${esc(host(x.url))}</span></a>`).join('');
  el.parentElement.insertBefore(s, el.nextSibling);
}
const FEEDBACK = API.replace(/\/chat$/, '/feedback'), HANDOVER = API.replace(/\/chat$/, '/handover');
async function rate(mid, rating, note) {
  try { const r = await fetch(FEEDBACK, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Session-Id': SESSION }, body: JSON.stringify({ message_id: mid, rating, note: note || null }) }); return r.ok && (await r.json()).ok; } catch { return false; }
}
function addTools(el, raw, retryText, mid, fb) {
  const row = el.parentElement; const t = document.createElement('div'); t.className = 'tools';
  if (mid) {   // thumbs: one click rates, a second click on "down" asks what was wrong (optional)
    const mk = (rating, label, path) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'tool mono' + (fb === rating ? ' on' : '');
      b.setAttribute('aria-label', label); b.title = label; b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">${path}</svg>`;
      b.onclick = async () => { const ok = await rate(mid, rating); if (!ok) return; t.querySelectorAll('.thumb').forEach(x => x.classList.remove('on')); b.classList.add('on');
        const tr = transcript.find(m => m.mid === mid); if (tr) { tr.fb = rating; persist(); }
        if (rating === -1 && !row.querySelector('.fbnote')) { const n = document.createElement('form'); n.className = 'fbnote';
          n.innerHTML = '<input maxlength="300" placeholder="What was wrong? (optional)"><button class="btn" type="submit">send</button>';
          n.onsubmit = async e => { e.preventDefault(); const v = n.querySelector('input').value.trim(); await rate(mid, -1, v); n.innerHTML = '<span class="note">Thanks, noted.</span>'; }; row.appendChild(n); } };
      b.classList.add('thumb'); return b; };
    t.appendChild(mk(1, 'Helpful', '<path d="M7 11v9H4v-9h3zm3 9h7.5a2 2 0 0 0 2-1.6l1.2-6A2 2 0 0 0 18.7 10H14V6a2 2 0 0 0-2-2l-2 7v9z"/>'));
    t.appendChild(mk(-1, 'Not helpful', '<path d="M17 13V4h3v9h-3zm-3-9H6.5a2 2 0 0 0-2 1.6l-1.2 6A2 2 0 0 0 5.3 14H10v4a2 2 0 0 0 2 2l2-7V4z"/>'));
  }
  const copy = document.createElement('button'); copy.type = 'button'; copy.className = 'tool mono';
  copy.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="1"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>copy';
  copy.onclick = async () => { try { await navigator.clipboard.writeText(raw()); copy.lastChild.textContent = 'copied'; setTimeout(() => copy.lastChild.textContent = 'copy', 1500); } catch { copy.lastChild.textContent = 'press ctrl+c'; } };
  t.appendChild(copy);
  if (retryText) { const r = document.createElement('button'); r.type = 'button'; r.className = 'tool mono';
    r.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12a8 8 0 1 1 2.3 5.7M4 20v-5h5"/></svg>retry';
    r.onclick = () => { row.remove(); const u = log.lastElementChild; if (u && u.dataset.role === 'user') u.remove(); history = history.slice(0, -2); transcript = transcript.slice(0, -2); persist(); send(retryText); }; t.appendChild(r); }
  row.appendChild(t);
}
// Hand-over to a human: a small form under the reply; the server stores it as a lead and emails the host.
function renderHandover(el, prefill) {
  if (el.querySelector('.hform')) return;
  const f = document.createElement('form'); f.className = 'hform';
  f.innerHTML = `<div class="mono lbl">message for deep</div>
    <input name="name" placeholder="Your name" maxlength="120" required autocomplete="name">
    <input name="email" type="email" placeholder="Your email" maxlength="200" required autocomplete="email">
    <textarea name="message" rows="3" placeholder="What would you like to ask?" maxlength="2000" required></textarea>
    <div class="hrow"><button class="btn primary" type="submit">Send to Deep</button><span class="note">Replies come by email.</span></div>`;
  const field = n => f.elements[n];   // not f.name: that is the form's own name attribute
  field('message').value = prefill || '';
  f.onsubmit = async e => { e.preventDefault(); const b = f.querySelector('button'); b.disabled = true; const email = field('email').value.trim();
    try { const r = await fetch(HANDOVER, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: SESSION, name: field('name').value.trim(), email, message: field('message').value.trim() }) });
      const d = r.ok ? await r.json() : null;
      if (d && d.ok) { f.innerHTML = `<div class="note ok">Sent. Deep will reply to ${esc(email)}.${d.visitor_mailed ? ' A copy is in your inbox.' : ''}</div>`; }
      else { b.disabled = false; f.querySelector('.note').textContent = r.status === 422 ? 'Please check the email address.' : 'Could not send right now. Please try again or email ' + (d && d.host_email || 'us') + '.'; } }
    catch { b.disabled = false; f.querySelector('.note').textContent = 'Connection problem. Please try again.'; } };
  el.appendChild(f); requestAnimationFrame(() => { scrollLatest(); field('name').focus(); });
}
function renderHandoverOffer(el, question) {
  const d = document.createElement('div'); d.className = 'handoff';
  const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = 'Ask Deep directly';
  b.onclick = () => { d.remove(); renderHandover(el, question); };
  d.appendChild(b); el.appendChild(d);
}
function scrollLatest() { log.scrollTop = log.scrollHeight; }
function atBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 40; }
log.addEventListener('scroll', () => jump.classList.toggle('show', !atBottom()));
jump.onclick = () => { scrollLatest(); jump.classList.remove('show'); };

function renderSuggestions() {
  const row = document.createElement('div'); row.className = 'row bot'; row.id = 'suggest-row';
  const meta = document.createElement('div'); meta.className = 'meta mono'; meta.innerHTML = '<span class="who">start with</span>';
  const s = document.createElement('div'); s.className = 'suggest';
  SUGGESTIONS.forEach(x => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = x; b.onclick = () => send(x); s.appendChild(b); });
  row.append(meta, s); log.appendChild(row);
}
function clearSuggestions() { const r = $('suggest-row'); if (r) r.remove(); }

// ---- transcript persistence (this tab only)
function persist() { try { sessionStorage.setItem(STORE, JSON.stringify(transcript.slice(-40))); } catch {} }
function restore() {
  try { transcript = JSON.parse(sessionStorage.getItem(STORE) || '[]'); } catch { transcript = []; }
  if (!transcript.length) { add('bot', `Hello. I answer from deependhq.com only and can book a call with Deep. Times are shown in ${TZ}.`); renderSuggestions(); return; }
  transcript.forEach(m => { const el = add(m.role === 'user' ? 'user' : 'bot', '', m.ts); setText(el, m.text, m.sources); if (m.role === 'bot') { addSources(el, m.sources); addTools(el, () => clean(m.text), null, m.mid, m.fb); } });
  history = transcript.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text })).slice(-12);
}
$('reset').onclick = () => { if (busy) stop(); transcript = []; history = []; persist(); log.innerHTML = ''; restore(); q.focus(); };
$('download').onclick = () => {
  const lines = transcript.map(m => `[${new Date(m.ts).toLocaleString()}] ${m.role === 'user' ? 'You' : 'deep >_'}: ${m.text}${m.sources && m.sources.length ? '\n  sources: ' + m.sources.map(s => s.url).join(', ') : ''}`);
  const blob = new Blob([`Ask deep >_ transcript · ${new Date().toLocaleString()} · session ${SESSION}\n\n` + lines.join('\n\n')], { type: 'text/plain' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `deep-chat-${new Date().toISOString().slice(0, 10)}.txt`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// ---- booking UI
let pickerSeq = 0;
function renderPicker(el, items) {
  if (!items || !items.length) return;
  const id = 'picker-' + (++pickerSeq);
  const wrap = document.createElement('div'); wrap.className = 'picker';
  const inner = document.createElement('div'); const box = document.createElement('div'); box.className = 'picker-in';
  const label = document.createElement('label'); label.className = 'mono'; label.htmlFor = id; label.textContent = 'call type';
  const sel = document.createElement('div'); sel.className = 'sel'; const select = document.createElement('select'); select.id = id;
  items.forEach((c, i) => { const o = document.createElement('option'); o.value = c.slug; o.textContent = `${c.name} · ${c.duration_min} min`; if (i === 0) o.selected = true; select.appendChild(o); });
  sel.appendChild(select);
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn primary'; btn.textContent = 'Choose this call';
  const hint = document.createElement('div'); hint.className = 'hint'; hint.textContent = 'Available times come next, in your timezone.';
  btn.onclick = () => { const c = items.find(x => x.slug === select.value) || items[0]; wrap.classList.add('done'); hint.textContent = `Chosen: ${c.name}.`; send(`Let's do the ${c.name} (${c.slug}). Show me times.`); };
  box.append(label, sel, btn, hint); inner.appendChild(box); wrap.appendChild(inner); el.appendChild(wrap);
  requestAnimationFrame(() => requestAnimationFrame(() => { wrap.classList.add('open'); scrollLatest(); }));
}
function renderSlots(el, ev) {
  const box = document.createElement('div');
  if (!ev.ok && ev.error === 'unknown_schedule') { renderPicker(el, ev.choices || []); return; }
  if (!ev.ok) {
    const p = document.createElement('div'); p.className = 'note warn';
    p.textContent = ev.error === 'no_slots' ? 'No open slots in that window.' : "Zoom's scheduler isn't responding right now.";
    box.appendChild(p);
    const a = document.createElement('div'); a.className = 'handoff';
    a.innerHTML = `<a class="btn primary" href="${esc(ev.fallback_link)}" target="_blank" rel="noopener">Open the booking page</a>`;
    box.appendChild(a);
  } else {
    const s = document.createElement('div'); s.className = 'slots';
    ev.slots.forEach(sl => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'btn';
      b.innerHTML = `${esc(sl.label_visitor)}<small>${ev.schedule ? esc(ev.schedule.name) + ' · ' : ''}${sl.duration_min} min · ${esc(sl.label_host)}</small>`;
      b.onclick = () => send(`I'd like the ${ev.schedule ? ev.schedule.name : 'call'} slot starting ${sl.start_iso} (${sl.label_visitor}).`);
      s.appendChild(b);
    });
    box.appendChild(s);
  }
  el.appendChild(box);
}
function renderBooking(el, ev) {
  const box = document.createElement('div'); box.className = 'handoff';
  if (ev.handoff_url) box.innerHTML = `<a class="btn primary" href="${esc(ev.handoff_url)}" target="_blank" rel="noopener">Confirm on Zoom</a>`;
  if (ev.status === 'slot_taken') { const p = document.createElement('div'); p.className = 'note warn'; p.textContent = 'That slot was just taken.'; box.appendChild(p); }
  if (ev.visitor_mailed) { const p = document.createElement('div'); p.className = 'note ok'; p.textContent = 'A confirmation with these details is on its way to your inbox.'; box.appendChild(p); }
  else if (ev.brief_sent === false && (ev.status === 'handoff' || ev.status === 'unavailable')) { const p = document.createElement('div'); p.className = 'note'; p.textContent = 'Your details were saved for Deep.'; box.appendChild(p); }
  el.appendChild(box);
}

// ---- send / stop
function stop() { if (controller) controller.abort(); }
async function send(text) {
  text = (text || q.value).trim(); if (!text || busy) return;
  q.value = ''; autosize(); clearSuggestions(); setBusy(true);
  add('user', text); transcript.push({ role: 'user', text, ts: Date.now() }); persist();
  const bot = add('bot', ''); thinking(bot);
  let answer = '', sources = [], allSources = [], failed = false, mid = null;
  controller = new AbortController();
  try {
    const r = await fetch(API, { method: 'POST', signal: controller.signal, headers: { 'Content-Type': 'application/json', 'X-Session-Id': SESSION, ...(VISITOR ? { 'X-Visitor-Id': VISITOR } : {}) },
      body: JSON.stringify({ message: text, history, timezone: TZ }) });
    if (!r.ok) { failed = true; setText(bot, r.status === 429 ? 'Slow down a little. Try again in a minute.' : `The assistant returned an error (${r.status}).`); return; }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!line.startsWith('data:')) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.type === 'token') { answer += ev.text; setText(bot, answer, allSources); }
        else if (ev.type === 'schedules') { bot.classList.remove('thinking'); renderPicker(bot, ev.items); }
        else if (ev.type === 'slots') { bot.classList.remove('thinking'); renderSlots(bot, ev); }
        else if (ev.type === 'booking') { bot.classList.remove('thinking'); renderBooking(bot, ev); }
        else if (ev.type === 'sources') { allSources = ev.items || []; }
        else if (ev.type === 'meta') { mid = ev.message_id || null; }
        else if (ev.type === 'handover') { bot.classList.remove('thinking'); renderHandover(bot, ev.prefill || ''); }
        else if (ev.type === 'handover_offer') { renderHandoverOffer(bot, text); }
        else if (ev.type === 'error') { failed = true; setText(bot, 'Something went wrong on the assistant side. ' + (answer ? '' : 'Please try again.')); }
        if (atBottom()) scrollLatest();
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') { setText(bot, answer || '(stopped)'); if (answer) bot.insertAdjacentHTML('beforeend', '<div class="note">Stopped.</div>'); }
    else { failed = true; setText(bot, 'Connection problem. Check that the assistant is running, then retry.'); setLive('off', 'offline'); }
  } finally {
    if (bot.classList.contains('thinking')) setText(bot, answer || '…', allSources);
    if (answer && allSources.length) { sources = usedSources(answer, allSources); addSources(bot, sources); }
    const raw = bot.dataset.raw || answer;
    addTools(bot, () => raw, failed ? text : null, mid);
    history.push({ role: 'user', content: text }, { role: 'assistant', content: answer }); history = history.slice(-12);
    transcript.push({ role: 'bot', text: answer, sources, ts: Date.now(), mid }); persist();
    controller = null; setBusy(false); if (live.classList.contains('off') && !failed) setLive('', 'ready'); q.focus();
  }
}
sendBtn.addEventListener('click', e => { if (busy) { e.preventDefault(); stop(); } });
f.addEventListener('submit', e => { e.preventDefault(); if (!busy) send(); });
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!busy) send(); } if (e.key === 'Escape' && busy) stop(); });
function autosize() { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 160) + 'px'; count.textContent = q.value.length > 1200 ? `${q.value.length} / 1500` : ''; }
q.addEventListener('input', autosize);
restore(); autosize();
// Deep link: /?q=What+is+ChampGraph prefills the question; add &send=1 to ask it immediately (site CTAs).
(function () { const pre = (EMBED.get('q') || '').trim().slice(0, 1500); if (!pre) return; q.value = pre; autosize();
  if (EMBED.get('send') === '1') setTimeout(() => send(pre), 150); else q.focus(); })();
</script>
