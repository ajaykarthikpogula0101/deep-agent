services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    ports: [ "5432:5432" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U assistant"], interval: 5s, timeout: 3s, retries: 20 }

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://assistant:assistant@db:5432/assistant
    ports: [ "8080:8080" ]
    depends_on:
      db: { condition: service_healthy }

  # one-shot: docker compose run --rm ingest
  ingest:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://assistant:assistant@db:5432/assistant
    command: ["python", "-m", "app.ingest.pipeline"]
    depends_on:
      db: { condition: service_healthy }
    profiles: [ "tools" ]

volumes:
  pgdata: {}
