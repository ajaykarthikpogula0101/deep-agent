<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="ask deep: the AI messenger for deependhq.com and the Champions Group companies">
  <title>ask deep: the AI messenger for deependhq.com</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1033"><animate attributeName="stop-color" values="#0B1033;#121852;#0B1033" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset=".55" stop-color="#1B1766"/>
      <stop offset="1" stop-color="#3A2BC4"><animate attributeName="stop-color" values="#3A2BC4;#5546F7;#3A2BC4" dur="12s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#8B7CFF" stop-opacity=".55"/><stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#3FA9FF" stop-opacity=".35"/><stop offset="1" stop-color="#3FA9FF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".09"/></pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="26"/></clipPath>
    <clipPath id="type"><rect x="40" y="90" width="0" height="130">
      <animate attributeName="width" from="0" to="640" begin=".3s" dur="1.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .2 1"/>
    </rect></clipPath>
    <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: Consolas, 'SF Mono', Menlo, 'Courier New', monospace; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <circle cx="1010" cy="30" r="290" fill="url(#g1)">
      <animate attributeName="cx" values="1010;920;1010" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="30;90;30" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="360" r="240" fill="url(#g2)">
      <animate attributeName="cx" values="140;260;140" dur="16s" repeatCount="indefinite"/>
    </circle>
    <!-- a slow light sweep across the banner -->
    <rect x="-400" y="0" width="300" height="340" fill="url(#shine)" transform="skewX(-18)">
      <animate attributeName="x" values="-400;1500" dur="7s" begin="2s" repeatCount="indefinite"/>
    </rect>

    <!-- brand line -->
    <g transform="translate(64 50)">
      <rect width="42" height="42" rx="12" fill="#5546F7"/>
      <text x="21" y="27.5" text-anchor="middle" class="mono" font-weight="700" font-size="17" fill="#fff">&gt;_</text>
      <text x="58" y="27" class="sans" font-size="15" font-weight="600" letter-spacing="2" fill="#BFC3FF">CHAMPIONS GROUP  ·  DEEPENDHQ.COM</text>
    </g>

    <!-- the title types itself, then the cursor blinks -->
    <g clip-path="url(#type)">
      <text x="60" y="190" class="sans" font-size="92" font-weight="800" letter-spacing="-2.5" fill="#fff">ask deep<tspan class="mono" font-weight="700" font-size="76" fill="#A99EFF" dx="22">&gt;</tspan><tspan class="mono" font-weight="700" font-size="76" fill="#A99EFF">_<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
    </g>

    <!-- tagline and pills fade in -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur=".6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="1.7s" dur=".6s" fill="freeze"/>
      <text x="64" y="230" class="sans" font-size="22" fill="#DADDFF">The AI messenger that answers with sources,</text>
      <text x="64" y="258" class="sans" font-size="22" fill="#DADDFF">books calls and keeps the news fresh.</text>
    </g>
    <g class="sans" font-size="14.5" font-weight="600" fill="#fff">
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.1s" dur=".4s" fill="freeze"/>
        <rect x="64" y="276" width="178" height="34" rx="17" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".25"/><text x="153" y="298" text-anchor="middle">💬  Answers with sources</text></g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.3s" dur=".4s" fill="freeze"/>
        <rect x="252" y="276" width="168" height="34" rx="17" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".25"/><text x="336" y="298" text-anchor="middle">📅  Zoom booking</text></g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.5s" dur=".4s" fill="freeze"/>
        <rect x="430" y="276" width="138" height="34" rx="17" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".25"/><text x="499" y="298" text-anchor="middle">📰  Live News</text></g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.7s" dur=".4s" fill="freeze"/>
        <rect x="578" y="276" width="150" height="34" rx="17" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".25"/><text x="653" y="298" text-anchor="middle">📋  Pre-call briefs</text></g>
    </g>

    <!-- a mini chat that plays on a loop: question, typing, answer, sources -->
    <g transform="translate(800 52)">
      <rect width="340" height="250" rx="20" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/>
      <circle cx="26" cy="26" r="11" fill="#5546F7"/>
      <text x="26" y="30.5" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#fff">&gt;_</text>
      <text x="46" y="24" class="sans" font-size="13" font-weight="700" fill="#fff">Deep</text>
      <text x="46" y="39" class="sans" font-size="10.5" fill="#BFC3FF">AI agent · Online</text>
      <circle cx="104" cy="35" r="3" fill="#3DDC97"><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></circle>
      <line x1="0" y1="54" x2="340" y2="54" stroke="#fff" stroke-opacity=".12"/>

      <!-- the visitor asks -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.05;.1;.93;1" dur="9s" repeatCount="indefinite"/>
        <rect x="128" y="68" width="196" height="32" rx="16" fill="#5546F7"/>
        <text x="226" y="89" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" fill="#fff">What does Lake B2B do?</text>
      </g>
      <!-- typing dots -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.14;.17;.3;.33;1" dur="9s" repeatCount="indefinite"/>
        <rect x="16" y="114" width="64" height="30" rx="15" fill="#fff" fill-opacity=".14"/>
        <circle cx="35" cy="129" r="3.5" fill="#fff"><animate attributeName="opacity" values=".3;1;.3" dur="1s" repeatCount="indefinite"/></circle>
        <circle cx="48" cy="129" r="3.5" fill="#fff"><animate attributeName="opacity" values=".3;1;.3" dur="1s" begin=".2s" repeatCount="indefinite"/></circle>
        <circle cx="61" cy="129" r="3.5" fill="#fff"><animate attributeName="opacity" values=".3;1;.3" dur="1s" begin=".4s" repeatCount="indefinite"/></circle>
      </g>
      <!-- the answer streams in, line by line -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.32;.34;.93;1" dur="9s" repeatCount="indefinite"/>
        <rect x="16" y="114" width="258" height="96" rx="16" fill="#fff" fill-opacity=".14"/>
        <rect x="30" y="130" height="8" rx="4" fill="#fff" fill-opacity=".85" width="0"><animate attributeName="width" values="0;0;220;220;0" keyTimes="0;.34;.42;.93;1" dur="9s" repeatCount="indefinite"/></rect>
        <rect x="30" y="148" height="8" rx="4" fill="#fff" fill-opacity=".85" width="0"><animate attributeName="width" values="0;0;200;200;0" keyTimes="0;.42;.5;.93;1" dur="9s" repeatCount="indefinite"/></rect>
        <rect x="30" y="166" height="8" rx="4" fill="#fff" fill-opacity=".85" width="0"><animate attributeName="width" values="0;0;228;228;0" keyTimes="0;.5;.58;.93;1" dur="9s" repeatCount="indefinite"/></rect>
        <rect x="30" y="184" height="8" rx="4" fill="#fff" fill-opacity=".85" width="0"><animate attributeName="width" values="0;0;130;130;0" keyTimes="0;.58;.64;.93;1" dur="9s" repeatCount="indefinite"/></rect>
        <circle cx="170" cy="188" r="7" fill="#A99EFF" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.64;.66;.93;1" dur="9s" repeatCount="indefinite"/></circle>
        <text x="170" y="191.5" text-anchor="middle" class="sans" font-size="9" font-weight="700" fill="#1B1766" opacity="0">1<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.64;.66;.93;1" dur="9s" repeatCount="indefinite"/></text>
      </g>
      <!-- the sources -->
      <g opacity="0" class="sans" font-size="10.5" font-weight="600">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.68;.72;.93;1" dur="9s" repeatCount="indefinite"/>
        <rect x="16" y="220" width="116" height="20" rx="10" fill="#fff" fill-opacity=".14"/><text x="74" y="234" text-anchor="middle" fill="#fff">1 · deependhq.com</text>
        <rect x="138" y="220" width="96" height="20" rx="10" fill="#fff" fill-opacity=".14"/><text x="186" y="234" text-anchor="middle" fill="#fff">2 · lakeb2b.com</text>
      </g>
    </g>
  </g>
</svg>
