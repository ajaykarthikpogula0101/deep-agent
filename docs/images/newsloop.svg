<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="How News stays fresh: tick, due, fetch, parse, save, refresh">
  <title>How News stays fresh: tick, due, fetch, parse, save, refresh</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1033"><animate attributeName="stop-color" values="#0B1033;#10164A;#0B1033" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset=".6" stop-color="#16135A"/>
      <stop offset="1" stop-color="#2A1E8C"><animate attributeName="stop-color" values="#2A1E8C;#3A2BC4;#2A1E8C" dur="12s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="ga"><stop offset="0" stop-color="#8B7CFF" stop-opacity=".45"/><stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb"><stop offset="0" stop-color="#3FA9FF" stop-opacity=".28"/><stop offset="1" stop-color="#3FA9FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="core" cx=".35" cy=".3"><stop offset="0" stop-color="#8B7CFF"/><stop offset=".6" stop-color="#5546F7"/><stop offset="1" stop-color="#2A1E8C"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".11"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#8B7CFF"/><stop offset="1" stop-color="#3FA9FF"/></linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".08"/></pattern>
    <clipPath id="clip"><rect width="1200" height="470" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <rect width="1200" height="470" fill="url(#bg)"/>
    <rect width="1200" height="470" fill="url(#dots)"/>
    <circle cx="983.9999999999999" cy="56.4" r="329.0" fill="url(#ga)"><animate attributeName="cx" values="983.9999999999999;864.0;983.9999999999999" dur="15s" repeatCount="indefinite"/></circle>
    <circle cx="144.0" cy="446.5" r="282.0" fill="url(#gb)"><animate attributeName="cx" values="144.0;288.0;144.0" dur="17s" repeatCount="indefinite"/></circle>
    <text x="64" y="48" text-anchor="start" font-size="13" font-weight="700" letter-spacing="3" fill="#A99EFF">HOW NEWS STAYS FRESH</text>
    <text x="64" y="78" text-anchor="start" font-size="25" font-weight="700" fill="#fff">Checked again soon after a site changes, less often while it&#x27;s quiet</text>
    <ellipse cx="600" cy="270" rx="360" ry="140" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3"/>
    <ellipse cx="600" cy="270" rx="360" ry="140" fill="none" stroke="url(#edge)" stroke-width="2" stroke-dasharray="4 10" stroke-opacity=".7">
      <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="11" fill="#fff" filter="url(#soft)"><animateMotion path="M600 130 A 360 140 0 1 1 599.99 130" dur="9s" repeatCount="indefinite"/></circle>
    <circle r="6" fill="#fff"><animateMotion path="M600 130 A 360 140 0 1 1 599.99 130" dur="9s" repeatCount="indefinite"/></circle>
    <g text-anchor="middle">
      <text x="600" y="256" font-size="15" font-weight="700" letter-spacing="2" fill="#A99EFF">ADAPTIVE SCHEDULE</text>
      <text x="600" y="290" font-size="30" font-weight="800" fill="#fff">15 min ⇄ 24 h</text>
      <text x="600" y="316" font-size="13.5" fill="#C9CCFF">sooner after a change · 1.5× later while quiet · backs off on errors</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur=".55s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.2s" dur=".55s" fill="freeze"/>
      <rect x="495" y="100" width="210" height="60" rx="16" fill="#0E1240" stroke="#fff" stroke-opacity=".18"/>
      <rect x="495" y="100" width="210" height="60" rx="16" fill="url(#core)" opacity=".2"><animate attributeName="opacity" values=".2;.2;1;.2;.2" keyTimes="0;0.000;0.040;0.140;1" dur="9s" repeatCount="indefinite"/></rect>
      <text x="517" y="137" font-size="20">⏱</text>
      <text x="549" y="127" font-size="15" font-weight="700" fill="#fff">Tick</text>
      <text x="549" y="145" font-size="11" fill="#D6D9FF">every 5 minutes</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.35s" dur=".55s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.35s" dur=".55s" fill="freeze"/>
      <rect x="807" y="170" width="210" height="60" rx="16" fill="#0E1240" stroke="#fff" stroke-opacity=".18"/>
      <rect x="807" y="170" width="210" height="60" rx="16" fill="url(#core)" opacity=".2"><animate attributeName="opacity" values=".2;.2;1;.2;.2" keyTimes="0;0.166;0.207;0.307;1" dur="9s" repeatCount="indefinite"/></rect>
      <text x="829" y="207" font-size="20">🎯</text>
      <text x="861" y="197" font-size="15" font-weight="700" fill="#fff">Due?</text>
      <text x="861" y="215" font-size="11" fill="#D6D9FF">only sources whose time came</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.5s" dur=".55s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.5s" dur=".55s" fill="freeze"/>
      <rect x="807" y="310" width="210" height="60" rx="16" fill="#0E1240" stroke="#fff" stroke-opacity=".18"/>
      <rect x="807" y="310" width="210" height="60" rx="16" fill="url(#core)" opacity=".2"><animate attributeName="opacity" values=".2;.2;1;.2;.2" keyTimes="0;0.332;0.373;0.473;1" dur="9s" repeatCount="indefinite"/></rect>
      <text x="829" y="347" font-size="20">📡</text>
      <text x="861" y="337" font-size="15" font-weight="700" fill="#fff">Fetch</text>
      <text x="861" y="355" font-size="11" fill="#D6D9FF">ETag · 304 · same bytes skip</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.6499999999999999s" dur=".55s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.6499999999999999s" dur=".55s" fill="freeze"/>
      <rect x="495" y="380" width="210" height="60" rx="16" fill="#0E1240" stroke="#fff" stroke-opacity=".18"/>
      <rect x="495" y="380" width="210" height="60" rx="16" fill="url(#core)" opacity=".2"><animate attributeName="opacity" values=".2;.2;1;.2;.2" keyTimes="0;0.499;0.540;0.640;1" dur="9s" repeatCount="indefinite"/></rect>
      <text x="517" y="417" font-size="20">🧩</text>
      <text x="549" y="407" font-size="15" font-weight="700" fill="#fff">Parse</text>
      <text x="549" y="425" font-size="11" fill="#D6D9FF">RSS · sitemaps · YouTube · Bing</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.8s" dur=".55s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.8s" dur=".55s" fill="freeze"/>
      <rect x="183" y="310" width="210" height="60" rx="16" fill="#0E1240" stroke="#fff" stroke-opacity=".18"/>
      <rect x="183" y="310" width="210" height="60" rx="16" fill="url(#core)" opacity=".2"><animate attributeName="opacity" values=".2;.2;1;.2;.2" keyTimes="0;0.666;0.707;0.807;1" dur="9s" repeatCount="indefinite"/></rect>
      <text x="205" y="347" font-size="20">💾</text>
      <text x="237" y="337" font-size="15" font-weight="700" fill="#fff">Save</text>
      <text x="237" y="355" font-size="11" fill="#D6D9FF">only real changes · removals</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.95s" dur=".55s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.95s" dur=".55s" fill="freeze"/>
      <rect x="183" y="170" width="210" height="60" rx="16" fill="#0E1240" stroke="#fff" stroke-opacity=".18"/>
      <rect x="183" y="170" width="210" height="60" rx="16" fill="url(#core)" opacity=".2"><animate attributeName="opacity" values=".2;.2;1;.2;.2" keyTimes="0;0.832;0.873;0.973;1" dur="9s" repeatCount="indefinite"/></rect>
      <text x="205" y="207" font-size="20">🔄</text>
      <text x="237" y="197" font-size="15" font-weight="700" fill="#fff">Refresh</text>
      <text x="237" y="215" font-size="11" fill="#D6D9FF">widget re-asks every 2 min</text>
    </g>

  </g>
</svg>
